<!doctype html>
<html lang="en" data-a11y-text-size="md">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#c5d8d7" />
		<script>
			(function () {
				var root = document.documentElement;
				var storageKey = 'dynamowaves-theme';
				var textSizeStorageKey = 'dynamowaves-text-size';
				var storedTheme = null;
				var storedTextSize = null;

				try {
					storedTheme = window.localStorage.getItem(storageKey);
					storedTextSize = window.localStorage.getItem(textSizeStorageKey);
				} catch (error) {
					// Storage can be unavailable in privacy-restricted browsing contexts.
				}

				var hasManualTheme = storedTheme === 'light' || storedTheme === 'dark';
				var prefersDark = false;

				try {
					prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} catch (error) {
					// Light is the deterministic fallback when matchMedia is unavailable.
				}

				root.dataset.zbkTheme = hasManualTheme ? storedTheme : prefersDark ? 'dark' : 'light';
				root.dataset.themeSource = hasManualTheme ? 'manual' : 'system';

				// Match mz-svelte's non-linear type curve before CSS paints. Dynamowaves
				// uses its own authorable Zebkit scale and exposes steps through 3xl.
				var textScales = { sm: 0.92, md: 1, lg: 1.15, xl: 1.5 };
				var textSize = Object.prototype.hasOwnProperty.call(textScales, storedTextSize)
					? storedTextSize
					: 'md';
				var typeScale = {
					minViewport: 360,
					maxViewport: 1240,
					minBase: 1.125,
					maxBase: 1.25,
					minRatio: 1.2,
					maxRatio: 1.25
				};
				var steps = ['3xs', '2xs', 'xs', 'sm', 'md', 'lg', 'xl', '2xl', '3xl'];
				var pivotIndex = steps.indexOf('md');
				var progress = Math.min(
					1,
					Math.max(
						0,
						(window.innerWidth - typeScale.minViewport) /
							(typeScale.maxViewport - typeScale.minViewport)
					)
				);
				var baseAt = function (index) {
					var offset = index - pivotIndex;
					var min = typeScale.minBase * Math.pow(typeScale.minRatio, offset);
					var max = typeScale.maxBase * Math.pow(typeScale.maxRatio, offset);
					return min + (max - min) * progress;
				};
				var zoom = textScales[textSize];
				var strength = zoom < 1 ? -0.725 : 0.725;
				var pivot = baseAt(pivotIndex);

				root.dataset.a11yTextSize = textSize;
				steps.forEach(function (step, index) {
					var modifier = 1 + (zoom - 1) * Math.pow(pivot / baseAt(index), strength);
					root.style.setProperty(
						'--zbk-a11y-font-size-modifier-' + step,
						String(Number(modifier.toFixed(6)))
					);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
